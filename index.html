<body>
<header class="topbar"><div class="topbar-inner"><div class="brand"><div class="brand-mark"><img src="头像.png" alt="头像"></div><div><h1>设计项目工作台</h1></div></div><nav class="actions" aria-label="工作台主要操作"><button class="btn has-tooltip" id="showAllBtn" type="button" data-tooltip="清除阶段筛选" aria-label="显示全部项目">显示全部</button><button class="btn has-tooltip" id="stageBtn" type="button" data-tooltip="新增、排序或删除阶段" aria-label="管理项目阶段">管理阶段</button><button class="btn has-tooltip" id="resetBtn" type="button" data-tooltip="恢复工作台的初始项目与待办" aria-label="恢复初始内容">恢复初始内容</button><button class="btn primary has-tooltip" id="createBtn" type="button" data-tooltip="快捷键 N" aria-label="新增项目" aria-keyshortcuts="N">新增项目</button></nav></div></header>
<main class="page">
  <section class="monitor" id="monitor" aria-label="按阶段筛选项目"></section>
  <div class="main-grid">
    <section class="workspace" id="workspace" aria-labelledby="ganttTitle">
      <div class="workspace-head"><div><h2 id="ganttTitle">设计项目甘特图</h2><p>项目按优先级排列。拖动甘特条调整开始时间，拖动两侧调整周期。</p></div><div class="controls" aria-label="甘特图视图控制">
        <div class="segmented" id="scaleTabs" role="tablist" aria-label="时间刻度"><button type="button" role="tab" data-scale="day">日</button><button type="button" role="tab" data-scale="week">周</button><button type="button" role="tab" data-scale="month">月</button><button type="button" role="tab" data-scale="year">年</button></div>
        <div class="view-nav" aria-label="切换时间范围"><button class="btn icon has-tooltip" id="prevViewBtn" type="button" aria-label="上一时间段" data-tooltip="上一时间段">‹</button><button class="btn small has-tooltip" id="todayViewBtn" type="button" data-tooltip="回到今天，快捷键 T" aria-label="回到今天" aria-keyshortcuts="T">今天</button><button class="btn icon has-tooltip" id="nextViewBtn" type="button" aria-label="下一时间段" data-tooltip="下一时间段">›</button></div>
        <div class="zoom-panel"><label for="zoomRange">横向</label><button class="zoom-btn has-tooltip" id="zoomOutBtn" type="button" aria-label="缩小时间轴" data-tooltip="缩小时间轴">−</button><input class="zoom-range" id="zoomRange" type="range" min="44" max="120" value="74" aria-label="时间轴横向缩放"><button class="zoom-btn has-tooltip" id="zoomInBtn" type="button" aria-label="放大时间轴" data-tooltip="放大时间轴">＋</button><output class="zoom-text" id="zoomText" for="zoomRange">100%</output></div>
        <div class="zoom-panel"><label for="vZoomRange">纵向</label><button class="zoom-btn has-tooltip" id="vZoomOutBtn" type="button" aria-label="压缩项目行" data-tooltip="压缩项目行">−</button><input class="zoom-range" id="vZoomRange" type="range" min="82" max="136" value="92" aria-label="项目行纵向缩放"><button class="zoom-btn has-tooltip" id="vZoomInBtn" type="button" aria-label="放大项目行" data-tooltip="放大项目行">＋</button><output class="zoom-text" id="vZoomText" for="vZoomRange">100%</output></div>
      </div></div>
      <div class="gantt-scroll" id="ganttScroll"><div class="gantt-content" id="ganttContent"><div class="timeline" id="timeline"></div><div id="projectRows"></div></div></div>
    </section>

  </div>
</main>

<div class="modal-overlay" id="projectModal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle"><div class="modal-head"><h3 id="projectModalTitle">新增项目</h3><button class="close has-tooltip" type="button" data-close="projectModal" aria-label="关闭项目窗口" data-tooltip="关闭">×</button></div><div class="form-grid">
  <div class="field full"><label for="titleInput">项目标题</label><input id="titleInput" maxlength="80" placeholder="例如：项目名称" required></div>
  <div class="field full"><label for="descInput">项目描述</label><textarea id="descInput" maxlength="500" placeholder="补充目标、交付内容或需要协作的信息"></textarea></div>
  <div class="field"><label for="statusInput">当前阶段</label><select id="statusInput"></select></div><div class="field"><label for="ownerInput">负责人</label><input id="ownerInput" maxlength="30" placeholder="例如：你的名字"></div>
  <div class="field"><label for="startInput">开始日期</label><input id="startInput" type="date"></div><div class="field"><label for="durationInput">持续天数</label><input id="durationInput" type="number" min="1" max="3650"></div>
  <div class="field"><label for="progressInput">阶段进度（自动计算）</label><input id="progressInput" type="number" min="0" max="100" readonly></div><div class="field"><label for="priorityInput">优先级</label><select id="priorityInput"><option>高</option><option>中</option><option>低</option></select></div>
  <div class="section-title">今日待处理</div><div class="field"><label>任务设置</label><label class="inline-check"><input id="addTaskInput" type="checkbox">加入指定日期的待处理事项</label></div><div class="field"><label for="taskDateInput">任务日期</label><input id="taskDateInput" type="date"></div><div class="field full"><label for="taskTextInput">待处理事项</label><input id="taskTextInput" maxlength="120" placeholder="例如：阶段修改需求"></div>
  
</div><div class="modal-actions"><button class="btn danger" id="deleteProjectBtn" type="button">删除项目</button><div class="actions"><button class="btn" type="button" data-close="projectModal">取消</button><button class="btn primary" id="saveProjectBtn" type="button">保存</button></div></div></div></div>

<div class="modal-overlay" id="taskModal"><div class="modal" style="max-width:520px" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle"><div class="modal-head"><h3 id="taskModalTitle">添加待处理事项</h3><button class="close has-tooltip" type="button" data-close="taskModal" aria-label="关闭待办窗口" data-tooltip="关闭">×</button></div><div class="form-grid"><div class="field full"><label for="taskProjectSelect">关联项目</label><select id="taskProjectSelect"></select></div><div class="field full"><label for="taskEditText">事项内容</label><input id="taskEditText" maxlength="120" placeholder="例如：确认最终脚本和录制计划" required></div><div class="field full"><label for="taskEditDate">日期</label><input id="taskEditDate" type="date"></div><div class="field" hidden><label for="taskDeltaInput">任务权重</label><input id="taskDeltaInput" type="number" min="0" max="100" value="0"></div></div><div class="modal-actions"><button class="btn danger" id="deleteTaskBtn" type="button">删除事项</button><div class="actions"><button class="btn" type="button" data-close="taskModal">取消</button><button class="btn primary" id="saveTaskBtn" type="button">保存</button></div></div></div></div>

<div class="modal-overlay" id="stageModal"><div class="modal" style="max-width:520px" role="dialog" aria-modal="true" aria-labelledby="stageModalTitle"><div class="modal-head"><h3 id="stageModalTitle">管理项目阶段</h3><button class="close has-tooltip" type="button" data-close="stageModal" aria-label="关闭阶段管理窗口" data-tooltip="关闭">×</button></div><div class="stage-list" id="stageList"></div><div class="stage-add"><input id="newStageName" type="text" placeholder="新阶段名称" aria-label="新阶段名称"><input id="newStageColor" type="color" value="#526044" aria-label="新阶段颜色"><button class="btn primary" id="addStageBtn" type="button">添加</button></div></div></div>
<div class="modal-overlay" id="summaryModal"><div class="modal" style="max-width:620px" role="dialog" aria-modal="true" aria-labelledby="summaryTitle"><div class="modal-head"><h3 id="summaryTitle">项目总结</h3><button class="close has-tooltip" type="button" data-close="summaryModal" aria-label="关闭项目总结窗口" data-tooltip="关闭">×</button></div><div class="summary-list" id="summaryList"></div></div></div>
<div class="modal-overlay" id="confirmModal"><div class="modal" style="max-width:430px" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmBody"><div class="modal-head"><h3 id="confirmTitle">确认</h3><button class="close has-tooltip" type="button" data-close="confirmModal" aria-label="关闭确认窗口" data-tooltip="关闭">×</button></div><div class="confirm-body" id="confirmBody"></div><div class="confirm-actions"><button class="btn" type="button" data-close="confirmModal">取消</button><button class="btn danger" id="confirmOkBtn" type="button">确认</button></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';
  const DATA_VERSION = 9;
  const STORAGE_KEY = 'designer-content-workbench-v6';
  const LEGACY_KEYS = ['xiaosu-workbench-v5','xiaosu-workbench-v4','xiaosu-workbench-v3','xiaosu-content-project-dashboard-v2'];
  const PRIORITY_WEIGHT = { '高':0, '中':1, '低':2 };
  const $ = id => document.getElementById(id);
  const todayDate = stripTime(new Date());
  const todayISO = toISO(todayDate);
  const weekNames = ['周日','周一','周二','周三','周四','周五','周六'];

  let stages = [], projects = [], tasks = [];
  let currentFilter = 'all', currentScale = 'day', zoomValue = 74, vZoomValue = 92, archiveExpanded = false;
  let editingProjectId = null, editingProjectTaskId = null, editingTaskId = null, confirmAction = null;
  let modalStack = [], activeDrag = null, dragRaf = 0, lastPointerX = 0, lastPointerY = 0;
  const viewStarts = {};

  const els = {
    monitor:$('monitor'), timeline:$('timeline'), rows:$('projectRows'), ganttScroll:$('ganttScroll'), ganttContent:$('ganttContent'), taskList:$('taskList'),
    scaleTabs:$('scaleTabs'), zoomRange:$('zoomRange'), zoomText:$('zoomText'), vZoomRange:$('vZoomRange'), vZoomText:$('vZoomText'), toast:$('toast'),
    projectModal:$('projectModal'), taskModal:$('taskModal'), stageModal:$('stageModal'), summaryModal:$('summaryModal'), confirmModal:$('confirmModal')
  };
  const inputs = {
    title:$('titleInput'), desc:$('descInput'), status:$('statusInput'), owner:$('ownerInput'), start:$('startInput'), duration:$('durationInput'), progress:$('progressInput'), priority:$('priorityInput'),
    addTask:$('addTaskInput'), taskDate:$('taskDateInput'), taskText:$('taskTextInput')
  };

  function stripTime(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function parseISO(iso){ if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso||''))) return stripTime(new Date()); const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
  function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function dateSerial(d){ return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000; }
  function daysBetween(a,b){ return Math.round(dateSerial(b)-dateSerial(a)); }
  function addDays(d,n){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
  function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
  function addMonthsSafe(d,n){ const y=d.getFullYear(), m=d.getMonth()+n, day=d.getDate(); const first=new Date(y,m,1); first.setDate(Math.min(day,daysInMonth(first.getFullYear(),first.getMonth()))); return first; }
  function addYearsSafe(d,n){ const y=d.getFullYear()+n,m=d.getMonth(),day=d.getDate(); return new Date(y,m,Math.min(day,daysInMonth(y,m))); }
  function startOfWeek(d){ const x=stripTime(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
  function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
  function escapeHTML(v){ return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
  function uid(prefix){ return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2,8)}`; }
  function formatDate(iso){ const d=parseISO(iso); return `${d.getMonth()+1}/${d.getDate()}`; }
  function projectEnd(p){ return addDays(parseISO(p.start), Math.max(1,Number(p.duration)||1)-1); }
  function contributedForProject(id){ return tasks.filter(t=>t.projectId===id&&t.contributed).reduce((s,t)=>s+(Number(t.progressDelta)||0),0); }
  function projectProgress(p){ const ordered=stages.slice().sort((a,b)=>a.order-b.order),index=ordered.findIndex(s=>s.id===p.status); if(index<0)return 0; return clamp(Math.round((index/Math.max(1,ordered.length-1))*4)*25,0,100); }
  function setProjectDisplayedProgress(p,target){ p.baseProgress=clamp((Number(target)||0)-contributedForProject(p.id),-10000,100); }
  function isProjectArchived(p){ const stage=stageById(p.status); return p.status==='publish'||/已结款|发布完成|已归档/.test(stage?.name||''); }

  function defaultStages(){ return [
    {id:'topic',name:'前期筹备',color:'#516d82',order:0},{id:'script',name:'初稿设计',color:'#c88b3d',order:1},{id:'shoot',name:'中期调整',color:'#526044',order:2},{id:'edit',name:'后期收尾',color:'#af5c45',order:3},{id:'publish',name:'已结款',color:'#6b8e7f',order:4}
  ]; }
  function defaultArchivedProjects(){
    const year=todayDate.getFullYear(),created=Date.now()-20000;
    return [
      {id:'archive_samsung_fold',title:'报告！三星折叠屏新成员来了？我是真没想到它能这么薄……',desc:'已发布视频',status:'publish',start:`${year}-07-16`,duration:7,baseProgress:100,owner:'小苏',priority:'中',createdAt:created+1},
      {id:'archive_ai_major_salary',title:'AI专业高薪神话，还能撑多久？普通人报AI，真的能吃到这波红利吗？',desc:'已发布视频',status:'publish',start:`${year}-06-22`,duration:7,baseProgress:100,owner:'小苏',priority:'中',createdAt:created+2},
      {id:'archive_red_mansion',title:'红楼梦还能这样打开？第一次去只有红楼梦戏剧幻城，完整体验报告！',desc:'已发布视频',status:'publish',start:`${year}-06-21`,duration:7,baseProgress:100,owner:'小苏',priority:'中',createdAt:created+3},
      {id:'archive_ai_agent',title:'AI Agent时代来了，但大多数人可能一开始就用错了？',desc:'已发布视频',status:'publish',start:`${year}-06-19`,duration:7,baseProgress:100,owner:'小苏',priority:'中',createdAt:created+4},
      {id:'archive_robot_housework',title:'为了不做家务，我和一个机器人同居了两周？结果真的蛮离谱……',desc:'已发布视频',status:'publish',start:`${year}-06-18`,duration:7,baseProgress:100,owner:'小苏',priority:'中',createdAt:created+5},
      {id:'archive_hku_ai',title:'普通人适合学AI专业吗？这几类学生真的要慎重！探访港大AI实验室',desc:'已发布视频',status:'publish',start:`${year}-06-15`,duration:7,baseProgress:100,owner:'小苏',priority:'中',createdAt:created+6}
    ].map(p=>({...p}));
  }
  function defaultData(){
    const created = Date.now()-5000;
    const ps=[
      {id:'p1',title:'AI工具测评视频',desc:'对比评测主流AI工具，给创作者选择指南',status:'script',start:toISO(addDays(todayDate,-3)),duration:7,baseProgress:25,owner:'小苏',priority:'高',createdAt:created+1},
      {id:'p2',title:'新产品体验视频',desc:'等待样机到位，先完成体验维度和镜头清单',status:'edit',start:toISO(addDays(todayDate,-1)),duration:6,baseProgress:75,owner:'小苏',priority:'中',createdAt:created+2},
      {id:'p3',title:'客户方案提报',desc:'框架已定稿，需要补充预算页和执行排期',status:'script',start:toISO(addDays(todayDate,-2)),duration:7,baseProgress:25,owner:'林',priority:'高',createdAt:created+3},
      {id:'p4',title:'外出拍摄',desc:'确认场地、交通与备用天气方案',status:'shoot',start:todayISO,duration:5,baseProgress:50,owner:'林',priority:'低',createdAt:created+4},
      {id:'p5',title:'月度选题整理',desc:'已汇总初版，按投入产出比排序',status:'topic',start:toISO(addDays(todayDate,-1)),duration:8,baseProgress:0,owner:'小苏',priority:'中',createdAt:created+5}
    ].map(p=>({...p})).concat(defaultArchivedProjects());
    const ts=[];
    return {version:DATA_VERSION,stages:defaultStages(),projects:ps,tasks:ts};
  }

  function normalizeStage(s,i){ return {id:String(s?.id||uid('stage')),name:String(s?.name||'未命名阶段'),color:String(s?.color||s?.c1||'#526044'),order:Number.isFinite(Number(s?.order))?Number(s.order):i}; }
  function normalizeTask(t,i){ return {id:String(t?.id||uid('task')),projectId:String(t?.projectId||''),text:String(t?.text||'待处理事项'),date:/^\d{4}-\d{2}-\d{2}$/.test(t?.date||'')?t.date:todayISO,done:!!t?.done,contributed:!!t?.contributed,progressDelta:clamp(Number(t?.progressDelta)||0,0,100),autoGenerated:!!t?.autoGenerated,autoDismissed:!!t?.autoDismissed,createdAt:Number(t?.createdAt)||Date.now()+i}; }
  function normalizeProject(p,i,taskList){
    const id=String(p?.id||uid('project')); const contrib=taskList.filter(t=>t.projectId===id&&t.contributed).reduce((s,t)=>s+t.progressDelta,0);
    const shown=clamp(Number(p?.progress ?? p?.baseProgress ?? 0),0,100);
    const base = p?.baseProgress!==undefined ? Number(p.baseProgress)||0 : shown-contrib;
    return {id,title:String(p?.title||'未命名项目'),desc:String(p?.desc||''),status:String(p?.status||'topic'),start:/^\d{4}-\d{2}-\d{2}$/.test(p?.start||'')?p.start:todayISO,duration:clamp(Number(p?.duration)||1,1,3650),baseProgress:clamp(base,-10000,100),owner:String(p?.owner||'小苏'),priority:['高','中','低'].includes(p?.priority)?p.priority:'中',createdAt:Number(p?.createdAt)||Date.now()+i};
  }
  function validateRelations(){
    stages.sort((a,b)=>a.order-b.order).forEach((s,i)=>s.order=i); if(!stages.length) stages=defaultStages();
    const stageIds=new Set(stages.map(s=>s.id)); projects.forEach(p=>{if(!stageIds.has(p.status))p.status=stages[0].id});
    const projectIds=new Set(projects.map(p=>p.id)); tasks=tasks.filter(t=>projectIds.has(t.projectId));
  }
  function loadData(){
    let raw=null,source=null;
    try{ raw=localStorage.getItem(STORAGE_KEY); source=STORAGE_KEY; if(!raw){ for(const key of LEGACY_KEYS){ const v=localStorage.getItem(key); if(v){raw=v;source=key;break;} } } }catch{}
    if(!raw){ applyData(defaultData()); saveData(); return; }
    try{ const data=JSON.parse(raw); const taskList=Array.isArray(data.tasks)?data.tasks.map(normalizeTask):[]; stages=(Array.isArray(data.stages)?data.stages:defaultStages()).map(normalizeStage); tasks=taskList; projects=(Array.isArray(data.projects)?data.projects:defaultData().projects).map((p,i)=>normalizeProject(p,i,taskList)); if(Number(data.version||0)<8){const known=new Map(projects.map(p=>[p.id,p]));defaultArchivedProjects().forEach((p,i)=>{const existing=known.get(p.id);if(existing)Object.assign(existing,{title:p.title,desc:p.desc,status:'publish',start:p.start,duration:p.duration,baseProgress:100,owner:p.owner,priority:p.priority});else projects.push(normalizeProject(p,projects.length+i,taskList));});} validateRelations(); if(source!==STORAGE_KEY||data.version!==DATA_VERSION)saveData(); }
    catch{ applyData(defaultData()); saveData(); }
  }
  function applyData(d){ stages=d.stages.map(normalizeStage); tasks=d.tasks.map(normalizeTask); projects=d.projects.map((p,i)=>normalizeProject(p,i,tasks)); validateRelations(); }
  function saveData(){ try{ localStorage.setItem(STORAGE_KEY,JSON.stringify({version:DATA_VERSION,stages,projects,tasks})); }catch{ showToast('本地存储失败，请检查浏览器权限'); } }
  function ensureTodayTasks(){
    const activeProjects=projects.filter(p=>!isProjectArchived(p)&&parseISO(p.start)<=todayDate&&projectEnd(p)>=todayDate);
    const activeIds=new Set(activeProjects.map(p=>p.id));
    let changed=false;
    tasks=tasks.filter(t=>{if(t.date===todayISO&&t.autoGenerated&&!activeIds.has(t.projectId)){changed=true;return false;}return true;});
    activeProjects.forEach(p=>{
      const existing=tasks.find(t=>t.projectId===p.id&&t.date===todayISO);
      const text=`推进「${p.title}」当前阶段：${stageById(p.status).name}`;
      if(!existing){tasks.push({id:uid('task'),projectId:p.id,text,date:todayISO,done:false,contributed:false,progressDelta:0,autoGenerated:true,autoDismissed:false,createdAt:Date.now()+tasks.length});changed=true;}
      else if(existing.autoGenerated&&existing.text!==text){existing.text=text;changed=true;}
    });
    if(changed)saveData();
  }

  function initViewStarts(){ viewStarts.day=addDays(todayDate,-45); viewStarts.week=addDays(startOfWeek(todayDate),-84); viewStarts.month=new Date(todayDate.getFullYear(),0,1); viewStarts.year=new Date(todayDate.getFullYear()-2,0,1); }
  function scaleConfig(){ return {day:{units:70},week:{units:30},month:{units:12},year:{units:5}}[currentScale]; }
  function unitStart(i){ const s=viewStarts[currentScale]; if(currentScale==='day')return addDays(s,i); if(currentScale==='week')return addDays(s,i*7); if(currentScale==='month')return addMonthsSafe(s,i); return addYearsSafe(s,i); }
  function unitEnd(i){ const s=unitStart(i); if(currentScale==='day')return s; if(currentScale==='week')return addDays(s,6); if(currentScale==='month')return addDays(addMonthsSafe(s,1),-1); return new Date(s.getFullYear(),11,31); }
  function unitIndexForDate(d){ const s=viewStarts[currentScale]; if(currentScale==='day')return Math.floor(daysBetween(s,d)); if(currentScale==='week')return Math.floor(daysBetween(s,d)/7); if(currentScale==='month')return (d.getFullYear()-s.getFullYear())*12+d.getMonth()-s.getMonth(); return d.getFullYear()-s.getFullYear(); }
  function shiftByUnits(d,n){ if(currentScale==='day')return addDays(d,n); if(currentScale==='week')return addDays(d,n*7); if(currentScale==='month')return addMonthsSafe(d,n); return addYearsSafe(d,n); }
  function getPeriod(i){ const s=unitStart(i),e=unitEnd(i); if(currentScale==='day')return {start:s,end:e,main:s.getDate(),sub:weekNames[s.getDay()],title:`${s.getFullYear()}年${s.getMonth()+1}月${s.getDate()}日`}; if(currentScale==='week')return {start:s,end:e,main:`W${String(getWeekNumber(s)).padStart(2,'0')}`,sub:`${s.getMonth()+1}/${s.getDate()}-${e.getMonth()+1}/${e.getDate()}`,title:`${s.getFullYear()}年第${getWeekNumber(s)}周`}; if(currentScale==='month')return {start:s,end:e,main:`${s.getMonth()+1}月`,sub:String(s.getFullYear()),title:`${s.getFullYear()}年${s.getMonth()+1}月`}; return {start:s,end:e,main:s.getFullYear(),sub:'全年',title:`${s.getFullYear()}年`}; }
  function getWeekNumber(d){ const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=x.getUTCDay()||7; x.setUTCDate(x.getUTCDate()+4-day); const y0=new Date(Date.UTC(x.getUTCFullYear(),0,1)); return Math.ceil((((x-y0)/86400000)+1)/7); }
  function visibleRange(p){ const cfg=scaleConfig(),sIdx=unitIndexForDate(parseISO(p.start)),eIdx=unitIndexForDate(projectEnd(p)); if(eIdx<0)return {outside:'left'}; if(sIdx>=cfg.units)return {outside:'right'}; const vs=clamp(sIdx,0,cfg.units-1),ve=clamp(eIdx,0,cfg.units-1); return {outside:null,startIndex:sIdx,endIndex:eIdx,visibleStart:vs,visibleEnd:ve,left:vs*zoomValue,width:Math.max(1,(ve-vs+1)*zoomValue),clippedLeft:sIdx<0,clippedRight:eIdx>=cfg.units}; }

  function stageById(id){ return stages.find(s=>s.id===id)||stages[0]; }
  function priorityColor(p){ return p==='高'? '#af5c45':p==='中'?'#c88b3d':'#526044'; }
  function sortedProjects(){ return projects.filter(p=>currentFilter==='all'||p.status===currentFilter).slice().sort((a,b)=>{ const pw=(PRIORITY_WEIGHT[a.priority]??9)-(PRIORITY_WEIGHT[b.priority]??9); if(pw)return pw; const due=dateSerial(projectEnd(a))-dateSerial(projectEnd(b)); if(due)return due; const st=dateSerial(parseISO(a.start))-dateSerial(parseISO(b.start)); if(st)return st; return (a.createdAt||0)-(b.createdAt||0); }); }

  function render(){ ensureTodayTasks(); renderMonitor(); renderTimeline(); renderRows(); renderTasks(); renderDate(); renderScaleTabs(); }
  function renderMonitor(){ const items=[{id:'all',name:'全部项目',note:'当前排期总览',color:'#516d82',count:projects.length},...stages.map(s=>({id:s.id,name:s.name,note:stageNote(s),color:s.color,count:projects.filter(p=>p.status===s.id).length}))]; els.monitor.innerHTML=items.map(x=>`<button type="button" class="monitor-card ${currentFilter===x.id?'active':''}" data-filter="${escapeHTML(x.id)}" style="--c:${x.color}" aria-pressed="${currentFilter===x.id}" aria-label="筛选${escapeHTML(x.name)}，${x.count}个项目"><span class="monitor-label">${escapeHTML(x.name)}</span><div class="monitor-value">${x.count}</div><div class="monitor-note">${escapeHTML(x.note)}</div></button>`).join(''); }
  function stageNote(s){ const map={topic:'未付定金，规划方向',script:'已付定金，初稿设计',shoot:'改稿调整和沟通阶段',edit:'未结尾款，收尾预交付',publish:'结款留档，项目结束'}; return map[s.id]||`${projects.filter(p=>p.status===s.id).length} 个项目`; }
  function renderTimeline(){ const cfg=scaleConfig(); document.documentElement.style.setProperty('--units',cfg.units); const todayIdx=unitIndexForDate(todayDate); document.documentElement.style.setProperty('--today-index',clamp(todayIdx,0,cfg.units-1)); let out='<div class="timeline-corner">项目 / 时间轴</div>'; for(let i=0;i<cfg.units;i++){ const p=getPeriod(i),isToday=todayDate>=p.start&&todayDate<=p.end; out+=`<button type="button" class="unit-cell ${isToday?'today':''}" data-period="${i}" aria-label="查看${escapeHTML(p.title)}的项目总结" ${isToday?'aria-current="date"':''}><span class="unit-main">${p.main}</span><span class="unit-sub">${escapeHTML(p.sub)}</span></button>`;} els.timeline.innerHTML=out; }
  function renderProjectRow(p,archived=false){
    const stage=stageById(p.status),progress=projectProgress(p),due=toISO(projectEnd(p)),range=visibleRange(p);
    let bar='';
    if(range.outside){
      bar=`<button type="button" class="edge-marker ${range.outside} has-tooltip" data-locate="${p.id}" style="--bar-color:${stage.color}" data-tooltip="定位到${escapeHTML(p.title)}" aria-label="定位到${escapeHTML(p.title)}的排期">${range.outside==='left'?'←':'→'}</button>`;
    }else{
